name: build-rust

on:
  push:
    branches: [main]
    tags: ['rust-v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install tauri-cli
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Run tests
        run: cargo test --workspace

      - name: Build release exe + NSIS installer
        run: cargo tauri build

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: maildeck-shell-windows-x64
          path: target/release/maildeck-shell.exe

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: maildeck-setup-windows-x64
          path: target/release/bundle/nsis/*.exe

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/rust-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/maildeck-shell.exe
            target/release/bundle/nsis/*.exe
