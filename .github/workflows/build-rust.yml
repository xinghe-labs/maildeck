name: build-rust

on:
  push:
    branches: [main]
    tags: ['rust-v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            exe_name: maildeck-shell.exe
            artifact: maildeck-windows-x64
          - os: macos-latest
            bundles: dmg
            exe_name: maildeck-shell
            artifact: maildeck-macos-aarch64
          - os: ubuntu-22.04
            bundles: appimage,deb
            exe_name: maildeck-shell
            artifact: maildeck-linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install tauri-cli
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev \
            libdbus-1-dev libglib2.0-dev

      - name: Cache cargo + tauri bundler tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.cache/tauri
            ~/AppData/Local/tauri
          key: ${{ matrix.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-

      - name: Run tests
        env:
          MAILDECK_NO_KEYRING: "1"
        run: cargo test --workspace

      - name: Build release binaries + bundles
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - name: Upload raw binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-bin
          path: target/release/${{ matrix.exe_name }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/rust-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
